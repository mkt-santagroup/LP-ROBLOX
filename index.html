    <!-- Fundo da tela de redirecionamento: servido localmente (public/background.png).
         Antes vinha de um bucket do Supabase — como a LP agora só existe pra
         redirecionar em ~4s, depender de um host externo pro fundo era risco de
         a pessoa ver tela em branco e sair antes do redirect. -->

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover habilita env(safe-area-inset-*) — usado pela navbar
         do /admin pra não ficar embaixo do notch/barra de gestos no celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d12" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Brazilian Life RP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- Fundo da tela de redirecionamento: servido localmente (public/background.png).
         Antes vinha de um bucket do Supabase — como a LP agora só existe pra
         redirecionar em ~4s, depender de um host externo pro fundo era risco de
         a pessoa ver tela em branco e sair antes do redirect. -->
    <link rel="preload" as="image" href="/background.png">

    <!-- Rastreamento desta página: só o pixel do Meta, e ele mora no CÓDIGO,
         em src/lib/metaPixel.ts. São dois disparos e só dois — PageView na
         abertura da LP e Reencaminhado na saída pro jogo.

         O GTM (GTM-TL5N76RP) foi REMOVIDO em 03/ago. Ele era o único jeito de
         o pixel disparar, e virou o problema: quando o vídeo saiu da página
         (01/ago), as tags amarradas nele morreram em silêncio e a conversão
         praticamente parou — 56 aberturas de página pra 3 conversões em 24h.
         Pior, tags de "assistiu 10/25/50/75/90% do vídeo" continuavam
         disparando por gatilho de TEMPO numa página que não tem mais vídeo:
         ~193 eventos falsos por dia, que entravam nos públicos de remarketing
         como se fossem gente engajada.

         Com o pixel no código, o que dispara está escrito aqui e é testável.
         Se um dia entrar Google Analytics ou Google Ads, o caminho é a tag
         própria de cada um — não um container que ninguém audita. -->
    </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
